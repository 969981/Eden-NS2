name: Cleanup older Eden-NS2 Releases (one-time)

# Only seven previously verified GitHub Release IDs; keeps newest three-platform release.
# Does not delete Git tags, branches, source history or workflow artifacts.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-old-releases-20261101.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eden-ns2-cleanup-old-releases-20261101
  cancel-in-progress: false

jobs:
  cleanup:
    name: Keep run-16 and delete seven historical Releases
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify protected release and remove only old Release objects
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          KEEP_ID=430457419
          KEEP_TAG=ns2-upstream-b2cef0c0f2e8-run-16
          actual="$(gh api "repos/$GH_REPO/releases/$KEEP_ID" --jq '.tag_name')"
          if [ "$actual" != "$KEEP_TAG" ]; then
            echo "::error::Protected three-platform release not found as expected; aborting"
            exit 1
          fi
          assets="$(gh api "repos/$GH_REPO/releases/$KEEP_ID" --jq '.assets[].name')"
          for filename in Eden-NS2-Windows-x64-MinGW.zip Eden-NS2-Linux-x64-Ubuntu24.04.tar.gz Eden-NS2-macOS-ARM64.dmg SHA256SUMS.txt; do
            if ! grep -Fxq "$filename" <<< "$assets"; then
              echo "::error::Protected release lacks $filename; aborting"
              exit 1
            fi
          done
          old_releases=(
            "430217617:ns2-upstream-b2cef0c0f2e8"
            "429948448:ns2-upstream-9c85f483fe43"
            "429659146:ns2-upstream-e2d416602f0c"
            "429461686:ns2-upstream-1c5c3f27db9c"
            "429204889:ns2-upstream-e2f285ab1ecd"
            "428799125:ns2-upstream-5d2d3cf0a966"
            "428694525:ns2-v0.1.0-alpha.6"
          )
          deleted=0
          for entry in "${old_releases[@]}"; do
            id="${entry%%:*}"
            tag="${entry#*:}"
            if [ "$id" = "$KEEP_ID" ] || [ "$tag" = "$KEEP_TAG" ]; then
              echo "::error::Protected release must not be deleted"
              exit 1
            fi
            current_tag="$(gh api "repos/$GH_REPO/releases/$id" --jq '.tag_name' 2>/dev/null || true)"
            if [ -z "$current_tag" ]; then
              echo "Release ID $id already absent; skipping"
              continue
            fi
            if [ "$current_tag" != "$tag" ]; then
              echo "::error::Release ID $id does not match expected tag $tag; aborting"
              exit 1
            fi
            gh api --method DELETE "repos/$GH_REPO/releases/$id"
            echo "- Deleted $tag (Release ID $id)" >> "$GITHUB_STEP_SUMMARY"
            deleted=$((deleted+1))
          done
          test "$(gh api "repos/$GH_REPO/releases/$KEEP_ID" --jq '.tag_name')" = "$KEEP_TAG"
          echo "Removed $deleted older Releases. Preserved $KEEP_TAG and all Git tags." >> "$GITHUB_STEP_SUMMARY"
