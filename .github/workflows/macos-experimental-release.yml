name: Eden-NS2 macOS ARM64 experimental release

# Isolated from upstream-sync-release.yml so macOS failures cannot block Windows/Linux.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/macos-experimental-release.yml"

permissions:
  contents: write

concurrency:
  group: eden-ns2-macos-${{ github.sha }}
  cancel-in-progress: false

jobs:
  macos:
    name: Build and package macOS Apple Silicon DMG
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install macOS dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install autoconf automake boost cmake ffmpeg fmt glslang hidapi \
            libtool libusb libzip lz4 ninja nlohmann-json openssl@3 opus \
            pkg-config qt@6 sdl3 speexdsp spirv-headers spirv-tools \
            vulkan-headers vulkan-loader molten-vk zstd
          cmake --version
          xcodebuild -version
          test "$(uname -m)" = "arm64"
          test -f "$(brew --prefix molten-vk)/lib/libMoltenVK.dylib"

      - name: Configure and compile macOS GUI
        shell: bash
        run: |
          set -euo pipefail
          QT_PREFIX="$(brew --prefix qt@6)"
          MOLTENVK="$(brew --prefix molten-vk)/lib/libMoltenVK.dylib"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            "-DQt6_DIR=$QT_PREFIX/lib/cmake/Qt6" \
            "-DCMAKE_PREFIX_PATH=$QT_PREFIX;$(brew --prefix openssl@3)" \
            "-DMOLTENVK_LIBRARY=$MOLTENVK" \
            -DYUZU_USE_BUNDLED_MOLTENVK=OFF \
            -DBUILD_TESTING=OFF -DYUZU_TESTS=OFF -DENABLE_WERROR=OFF \
            -DYUZU_ROOM=OFF -DYUZU_CMD=OFF -DENABLE_LIBUSB=OFF \
            -DENABLE_UPDATE_CHECKER=OFF \
            -Denet_FORCE_BUNDLED=ON \
            -DVulkanMemoryAllocator_FORCE_BUNDLED=ON \
            -DVulkanHeaders_FORCE_BUNDLED=ON \
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON
          cmake --build build --target yuzu --parallel 3
          test -x build/bin/eden.app/Contents/MacOS/eden

      - name: Deploy, ad-hoc sign, and build DMG
        shell: bash
        run: |
          set -euo pipefail
          APP="build/bin/eden.app"
          "$(brew --prefix qt@6)/bin/macdeployqt" "$APP" -always-overwrite
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          mkdir -p dist/packages
          hdiutil create -volname "Eden-NS2" -srcfolder "$APP" \
            -ov -format UDZO dist/packages/Eden-NS2-macOS-ARM64.dmg
          test -s dist/packages/Eden-NS2-macOS-ARM64.dmg
          (cd dist/packages && shasum -a 256 Eden-NS2-macOS-ARM64.dmg > SHA256SUMS-macOS.txt)
          file "$APP/Contents/MacOS/eden"
          hdiutil verify dist/packages/Eden-NS2-macOS-ARM64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: eden-ns2-macos-arm64
          path: dist/packages/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish successful macOS DMG
    runs-on: ubuntu-24.04
    needs: [macos]
    if: needs.macos.result == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: eden-ns2-macos-arm64
          path: dist
      - name: Verify and publish macOS DMG without touching Windows/Linux assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd dist
          test -s Eden-NS2-macOS-ARM64.dmg
          sha256sum -c SHA256SUMS-macOS.txt
          cd ..
          RELEASE_TAG=""
          # Prefer the Windows/Linux release built from identical emulator source.
          # The workflow-only commit is harmless and must not change binary source.
          while IFS=$'\t' read -r TAG TARGET; do
            if [[ "$TAG" == ns2-upstream-* && "$TARGET" =~ ^[0-9a-f]{40}$ ]] && \
               git merge-base --is-ancestor "$TARGET" "$GITHUB_SHA" && \
               [[ -z "$(git diff --name-only "$TARGET" "$GITHUB_SHA" -- . ':(exclude).github/workflows/macos-experimental-release.yml')" ]]; then
              RELEASE_TAG="$TAG"
              break
            fi
          done < <(gh api "repos/$GH_REPO/releases?per_page=50" \
            --jq '.[] | [.tag_name, .target_commitish] | @tsv')
          if [ -n "$RELEASE_TAG" ]; then
            gh release upload "$RELEASE_TAG" dist/Eden-NS2-macOS-ARM64.dmg \
              dist/SHA256SUMS-macOS.txt --clobber
          else
            RELEASE_TAG="ns2-macos-${GITHUB_SHA:0:12}"
            NOTES="Experimental Apple Silicon (ARM64) macOS 15+ build from $GITHUB_SHA. Not notarized. Requires Apple Silicon; MoltenVK compatibility and game stability are not guaranteed. No games, firmware or keys included."
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              gh release upload "$RELEASE_TAG" dist/Eden-NS2-macOS-ARM64.dmg \
                dist/SHA256SUMS-macOS.txt --clobber
            else
              gh release create "$RELEASE_TAG" dist/Eden-NS2-macOS-ARM64.dmg \
                dist/SHA256SUMS-macOS.txt --target "$GITHUB_SHA" \
                --title "Eden-NS2 macOS ARM64 experimental $RELEASE_TAG" \
                --notes "$NOTES" --prerelease
            fi
          fi
          echo "macOS DMG published: https://github.com/$GH_REPO/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
