name: Sync upstream and release Windows + Linux + macOS

# Check upstream hourly. On new upstream commits, build all three platforms and publish together.
# A push of THIS workflow file bootstraps the first sync immediately.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Rebuild current merged source even if upstream has not changed"
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - ".github/workflows/upstream-sync-release.yml"

permissions:
  contents: write

concurrency:
  group: eden-ns2-upstream-sync-release
  cancel-in-progress: false

jobs:
  sync:
    name: Merge 0x2593/Eden-NS2 main into main, without force pushing
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
      commit: ${{ steps.merge.outputs.commit }}
      upstream: ${{ steps.merge.outputs.upstream }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
          persist-credentials: true
      - name: Fetch upstream and merge if needed
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Start from the latest main, not the potentially stale event SHA.
          git fetch --no-tags origin main
          git checkout -B main origin/main
          git remote add upstream https://github.com/0x2593/Eden-NS2.git
          git fetch --no-tags upstream main
          UPSTREAM_SHA="$(git rev-parse upstream/main)"
          printf 'upstream=%s\n' "$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          echo "Current main: $(git rev-parse HEAD)"
          echo "Upstream main: $UPSTREAM_SHA"
          if git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD; then
            echo "No new upstream commits. No automatic build or release."
            if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.force_rebuild || false }}" = "true" ]; then
              echo "Workflow-file push or manual force_rebuild selected: verify all three platforms."
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "New upstream commits detected. Merging normally, preserving both histories."
            # A known comment-only overlap in Ampere ATOMS.POPC is safe to resolve.
            # All other conflicts still fail without pushing or rewriting main.
            if ! git merge --no-ff --no-edit upstream/main; then
              conflict_path="src/shader_recompiler/frontend/ampere/ops_memory.cpp"
              local_comment="    // ATOMS.POPC has no destination register; the old shared value is intentionally discarded."
              if [[ "$(git diff --name-only --diff-filter=U)" == "$conflict_path" ]] &&
                 git show ":2:$conflict_path" | grep -Fqx "$local_comment" &&
                 diff -q <(git show ":2:$conflict_path" | grep -Fvx "$local_comment") \
                         <(git show ":3:$conflict_path") >/dev/null; then
                echo "Verified comment-only ATOMS.POPC overlap; retaining the local comment and upstream fix."
                git checkout --ours -- "$conflict_path"
                git add -- "$conflict_path"
                git commit --no-edit
              else
                git merge --abort || true
                echo "::error::Upstream merge conflict needs manual review. main was not overwritten."
                exit 1
              fi
            fi
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          SHA="$(git rev-parse HEAD)"
          echo "commit=$SHA" >> "$GITHUB_OUTPUT"
          echo "Merged source commit: $SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Upstream commit: $UPSTREAM_SHA" >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows x64 (MinGW / GUI)
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: windows-2022
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.commit }}
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git autoconf automake libtool make patch zip unzip
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-qt6-charts
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-sdl3
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-vulkan-headers
            mingw-w64-x86_64-vulkan-utility-libraries
            mingw-w64-x86_64-python
      - name: Configure and compile
        shell: msys2 {0}
        run: |
          command -v patch
          patch --version | head -1
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF -DYUZU_TESTS=OFF -DENABLE_WERROR=OFF \
            -DYUZU_ROOM=OFF -DYUZU_CMD=OFF -DENABLE_LIBUSB=OFF \
            -DENABLE_UPDATE_CHECKER=OFF \
            -Denet_FORCE_BUNDLED=ON -Dlibusb_FORCE_BUNDLED=ON \
            -DVulkanMemoryAllocator_FORCE_BUNDLED=ON
          ninja -C build yuzu
          test -f build/bin/eden.exe
      - name: Bundle Qt, runtime DLLs and ZIP
        shell: msys2 {0}
        run: |
          set -e
          mkdir -p dist/windows dist/packages
          cp -a build/bin/. dist/windows/
          DEPLOY_TOOL="$(command -v windeployqt6.exe || command -v windeployqt.exe)"
          "$DEPLOY_TOOL" --release --no-translations dist/windows/eden.exe
          # The NS2 fork uses additional shared MinGW libraries not necessarily known to Qt.
          for pass in 1 2 3 4; do
            find dist/windows -type f \( -iname '*.exe' -o -iname '*.dll' \) -print0 \
              | xargs -0 -r ldd 2>/dev/null \
              | awk '/\/mingw64\/bin\// { print $3 }' | sort -u \
              | while IFS= read -r dependency; do
                  test -f "$dependency" && cp -n "$dependency" dist/windows/ || true
                done
          done
          printf '[Paths]\nPlugins = plugins\n' > dist/windows/qt.conf
          cp LICENSE.txt dist/windows/
          (cd dist/windows && zip -qr ../packages/Eden-NS2-Windows-x64-MinGW.zip .)
          test -s dist/packages/Eden-NS2-Windows-x64-MinGW.zip
      - uses: actions/upload-artifact@v4
        with:
          name: package-windows-x64
          path: dist/packages/*.zip
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux x64 (Ubuntu 24.04)
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.commit }}
          submodules: recursive
      - name: Install Linux build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential clang git glslang-tools \
            libglu1-mesa-dev libhidapi-dev libpulse-dev libtool libudev-dev \
            nasm ninja-build libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxext-dev \
            libxkbcommon-x11-0 qt6-base-dev qt6-base-private-dev \
            qt6-tools-dev qt6-charts-dev libfmt-dev liblz4-dev \
            nlohmann-json3-dev libzstd-dev libssl-dev libavfilter-dev \
            libavcodec-dev libswscale-dev pkg-config zlib1g-dev libva-dev \
            libvdpau-dev libvulkan-dev spirv-tools spirv-headers \
            libusb-1.0-0-dev libboost-dev libboost-fiber-dev \
            libboost-context-dev libopus-dev libasound2-dev libgl1-mesa-dev \
            libzip-dev
          python3 -m pip install --break-system-packages "cmake>=3.31,<4"
      - name: Configure and compile Linux GUI
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF -DYUZU_TESTS=OFF -DENABLE_WERROR=OFF \
            -DYUZU_ROOM=OFF -DYUZU_CMD=OFF -DENABLE_LIBUSB=OFF \
            -DENABLE_UPDATE_CHECKER=OFF \
            -DYUZU_USE_BUNDLED_SDL3=ON -Denet_FORCE_BUNDLED=ON \
            -Dfmt_FORCE_BUNDLED=ON -Dxbyak_FORCE_BUNDLED=ON \
            -DVulkanMemoryAllocator_FORCE_BUNDLED=ON \
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON
          cmake --build build --target yuzu --parallel 3
          test -x build/bin/eden
      - name: Package Ubuntu archive
        run: |
          set -e
          mkdir -p dist/linux dist/packages
          cp -a build/bin/. dist/linux/
          cp LICENSE.txt dist/linux/
          printf '%s\n' \
            "Eden-NS2 experimental Linux x86_64 build (Ubuntu 24.04)." \
            "This is NOT an AppImage; compatible system Qt, FFmpeg, Vulkan and other runtime libraries are required." \
            "No games, firmware or keys included. Source: ${{ needs.sync.outputs.commit }}" \
            > dist/linux/README-REQUIREMENTS.txt
          tar -czf dist/packages/Eden-NS2-Linux-x64-Ubuntu24.04.tar.gz -C dist/linux .
          test -s dist/packages/Eden-NS2-Linux-x64-Ubuntu24.04.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: package-linux-x64
          path: dist/packages/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS ARM64 (Apple Silicon / DMG)
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.commit }}
          submodules: recursive

      - name: Install macOS dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install autoconf automake boost cmake ffmpeg fmt glslang hidapi \
            libtool libusb libzip lz4 ninja nlohmann-json openssl@3 opus \
            pkg-config qt@6 sdl3 speexdsp spirv-headers spirv-tools \
            vulkan-headers vulkan-loader molten-vk zstd
          cmake --version
          xcodebuild -version
          test "$(uname -m)" = "arm64"
          test -f "$(brew --prefix molten-vk)/lib/libMoltenVK.dylib"

      - name: Configure and compile macOS GUI
        shell: bash
        run: |
          set -euo pipefail
          QT_PREFIX="$(brew --prefix qt@6)"
          MOLTENVK="$(brew --prefix molten-vk)/lib/libMoltenVK.dylib"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            "-DQt6_DIR=$QT_PREFIX/lib/cmake/Qt6" \
            "-DCMAKE_PREFIX_PATH=$QT_PREFIX;$(brew --prefix openssl@3)" \
            "-DMOLTENVK_LIBRARY=$MOLTENVK" \
            -DYUZU_USE_BUNDLED_MOLTENVK=OFF \
            -DBUILD_TESTING=OFF -DYUZU_TESTS=OFF -DENABLE_WERROR=OFF \
            -DYUZU_ROOM=OFF -DYUZU_CMD=OFF -DENABLE_LIBUSB=OFF \
            -DENABLE_UPDATE_CHECKER=OFF \
            -Denet_FORCE_BUNDLED=ON \
            -DVulkanMemoryAllocator_FORCE_BUNDLED=ON \
            -DVulkanHeaders_FORCE_BUNDLED=ON \
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON
          cmake --build build --target yuzu --parallel 3
          test -x build/bin/eden.app/Contents/MacOS/eden

      - name: Deploy, ad-hoc sign, and build DMG
        shell: bash
        run: |
          set -euo pipefail
          APP="build/bin/eden.app"
          "$(brew --prefix qt@6)/bin/macdeployqt" "$APP" -always-overwrite
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          mkdir -p dist/packages
          hdiutil create -volname "Eden-NS2" -srcfolder "$APP" \
            -ov -format UDZO dist/packages/Eden-NS2-macOS-ARM64.dmg
          test -s dist/packages/Eden-NS2-macOS-ARM64.dmg
          (cd dist/packages && shasum -a 256 Eden-NS2-macOS-ARM64.dmg > SHA256SUMS-macOS.txt)
          file "$APP/Contents/MacOS/eden"
          hdiutil verify dist/packages/Eden-NS2-macOS-ARM64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: package-macos-arm64
          path: dist/packages/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish Windows + Linux + macOS together
    runs-on: ubuntu-24.04
    needs: [sync, windows, linux, macos]
    if: >-
      needs.sync.outputs.changed == 'true' &&
      needs.windows.result == 'success' &&
      needs.linux.result == 'success' &&
      needs.macos.result == 'success'
    steps:
      - name: Download all three platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Verify three packages and publish one new GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
          GH_REPO: ${ github.repository }}
          SOURCE_SHA: ${ needs.sync.outputs.commit }}
          UPSTREAM_SHA: ${ needs.sync.outputs.upstream }}
        run: |
          set -euo pipefail
          cd dist
          WINDOWS="Eden-NS2-Windows-x64-MinGW.zip"
          LINUX="Eden-NS2-Linux-x64-Ubuntu24.04.tar.gz"
          MACOS="Eden-NS2-macOS-ARM64.dmg"
          test -s "$WINDOWS"
          test -s "$LINUX"
          test -s "$MACOS"
          sha256sum -c SHA256SUMS-macOS.txt
          sha256sum "$WINDOWS" "$LINUX" "$MACOS" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          # Fresh tag per successful run: no updates to old releases.
          TAG="ns2-upstream-${UPSTREAM_SHA:0:12}-run-${GITHUB_RUN_NUMBER}"
          if [[ ! "$TAG" =~ ^ns2-upstream-[0-9a-f]{12}-run-[0-9]+$ ]]; then
            echo "::error::Unsafe release tag $TAG"
            exit 1
          fi
          cat > release-notes.md <<EOF
          # Eden-NS2 experimental three-platform build

          Upstream: 0x2593/Eden-NS2 main at $UPSTREAM_SHA.
          Local merged source: $SOURCE_SHA.
          GitHub Actions run: $GITHUB_RUN_ID.

          All three packages were built from the same merged source commit and released together.

          - Windows x64 (MinGW): portable ZIP with Qt and runtime DLLs.
          - Linux x64 (Ubuntu 24.04): TAR.GZ; requires compatible system libraries, not an AppImage.
          - macOS ARM64 (Apple Silicon, macOS 15+): DMG containing an ad-hoc-signed app; not Apple-notarized.
          - SHA256SUMS.txt: hashes for all three packages.

          Unofficial experimental Switch 2 emulator build; successful compilation does not guarantee game compatibility.
          Back up saves. No Nintendo games, firmware, or keys included.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$WINDOWS" "$LINUX" "$MACOS" SHA256SUMS.txt --clobber
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" "$WINDOWS" "$LINUX" "$MACOS" SHA256SUMS.txt \
              --target "$SOURCE_SHA" \
              --title "Eden-NS2 Three-Platform Build ${UPSTREAM_SHA:0:12} (run $GITHUB_RUN_NUMBER)" \
              --notes-file release-notes.md --prerelease
          fi
          echo "Published all three platforms: https://github.com/$GH_REPO/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
