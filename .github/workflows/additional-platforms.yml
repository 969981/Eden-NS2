name: Eden-NS2 additional platforms (experimental)

# Builds use the SAME emulator sources as the working Windows alpha.6 release.
# This workflow does not modify or rebuild the Windows release.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Exact emulator source ref (default is Windows alpha.6 SHA)"
        required: false
        default: "bc627e75b27f759fc22d0f8e2b10cdaea7870880"
        type: string
      release_tag:
        description: "Existing release tag to attach successful packages to"
        required: false
        default: "ns2-v0.1.0-alpha.6"
        type: string
      build_macos:
        description: "Try macOS ARM64 experimental build"
        required: false
        type: boolean
        default: true
  push:
    branches: [main]
    paths: [".github/workflows/additional-platforms.yml"]

permissions:
  contents: write

concurrency:
  group: eden-ns2-other-platforms-${{ github.ref }}
  cancel-in-progress: false

env:
  EDEN_SOURCE_REF: "${{ inputs.source_ref || 'bc627e75b27f759fc22d0f8e2b10cdaea7870880' }}"
  EDEN_TARGET_TAG: "${{ inputs.release_tag || 'ns2-v0.1.0-alpha.6' }}"

jobs:
  linux:
    name: Linux x64 (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ env.EDEN_SOURCE_REF }}"
          submodules: recursive
      - name: Install Linux build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential clang git glslang-tools \
            libglu1-mesa-dev libhidapi-dev libpulse-dev libtool libudev-dev \
            nasm ninja-build libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxext-dev \
            libxkbcommon-x11-0 qt6-base-dev qt6-base-private-dev \
            qt6-tools-dev qt6-charts-dev libfmt-dev liblz4-dev \
            nlohmann-json3-dev libzstd-dev libssl-dev libavfilter-dev \
            libavcodec-dev libswscale-dev pkg-config zlib1g-dev libva-dev \
            libvdpau-dev libvulkan-dev spirv-tools spirv-headers \
            libusb-1.0-0-dev libboost-dev libboost-fiber-dev \
            libboost-context-dev libopus-dev libasound2-dev libgl1-mesa-dev \
            libzip-dev
          python3 -m pip install --break-system-packages "cmake>=3.31,<4"
      - name: Configure and compile Linux GUI
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF -DYUZU_TESTS=OFF -DENABLE_WERROR=OFF \
            -DYUZU_ROOM=OFF -DYUZU_CMD=OFF -DENABLE_LIBUSB=OFF \
            -DENABLE_UPDATE_CHECKER=OFF \
            -DYUZU_USE_BUNDLED_SDL3=ON -Denet_FORCE_BUNDLED=ON \
            -Dfmt_FORCE_BUNDLED=ON -Dxbyak_FORCE_BUNDLED=ON \
            -DVulkanMemoryAllocator_FORCE_BUNDLED=ON \
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON
          cmake --build build --target yuzu --parallel 3
          test -x build/bin/eden
      - name: Package Ubuntu archive
        run: |
          set -e
          mkdir -p dist/linux dist/packages
          cp -a build/bin/. dist/linux/
          cp LICENSE.txt dist/linux/
          printf '%s\n' \
            "Eden-NS2 experimental Linux x86_64 build (Ubuntu 24.04)." \
            "This is NOT an AppImage; compatible system Qt, FFmpeg, Vulkan and other runtime libraries are required." \
            "No games, firmware or keys included. Source: $EDEN_SOURCE_REF" \
            > dist/linux/README-REQUIREMENTS.txt
          tar -czf dist/packages/Eden-NS2-Linux-x64-Ubuntu24.04.tar.gz -C dist/linux .
          test -s dist/packages/Eden-NS2-Linux-x64-Ubuntu24.04.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-linux-x64
          path: dist/packages/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android ARM64 (standard)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ env.EDEN_SOURCE_REF }}"
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Find and prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export SDK_ROOT="${{ env.ANDROID_HOME || '/usr/local/lib/android/sdk' }}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$SDK_MANAGER" ]; then
            echo "No sdkmanager in $SDK_ROOT/cmdline-tools; please install Android command-line tools" >&2
            exit 1
          fi
          echo "Using SDK manager: $SDK_MANAGER"
          yes | "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --install \
            "platforms;android-36" "build-tools;36.0.0" \
            "ndk;28.2.13676358" "cmake;3.31.5"
          test -d "$SDK_ROOT/platforms/android-36"
          test -d "$SDK_ROOT/ndk/28.2.13676358"
      - name: Build APK
        env:
          GIT_TAG_NAME: ns2-v0.1.0-alpha.6
        run: |
          bash .ci/android/build.sh --target standard --build-type Release
          mkdir -p dist/packages
          APK="$(find artifacts -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" dist/packages/Eden-NS2-Android-Standard-arm64.apk
          test -s dist/packages/Eden-NS2-Android-Standard-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-android-standard
          path: dist/packages/*.apk
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS ARM64 (experimental)
    if: github.event_name == 'push' || inputs.build_macos
    runs-on: macos-15-arm64
    timeout-minutes: 240
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ env.EDEN_SOURCE_REF }}"
          submodules: recursive
      - name: Install tools and compile GUI
        shell: bash
        run: |
          brew install cmake ninja qt ffmpeg sdl3 boost openssl@3 fmt lz4 zstd \
            libzip opus nasm pkg-config vulkan-headers molten-vk
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF -DYUZU_TESTS=OFF -DENABLE_WERROR=OFF \
            -DYUZU_ROOM=OFF -DYUZU_CMD=OFF -DENABLE_LIBUSB=OFF \
            -DENABLE_UPDATE_CHECKER=OFF -Denet_FORCE_BUNDLED=ON \
            -Dfmt_FORCE_BUNDLED=ON \
            -DVulkanMemoryAllocator_FORCE_BUNDLED=ON \
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON
          cmake --build build --target yuzu --parallel 3
          test -d build/bin/eden.app
      - name: Bundle app and DMG
        shell: bash
        run: |
          set -e
          QT_DEPLOY="$(brew --prefix qt)/bin/macdeployqt"
          "$QT_DEPLOY" build/bin/eden.app
          mkdir -p dist/packages
          hdiutil create -volname Eden-NS2 -srcfolder build/bin/eden.app \
            -ov -format UDZO dist/packages/Eden-NS2-macOS-ARM64.dmg
          test -s dist/packages/Eden-NS2-macOS-ARM64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-macos-arm64
          path: dist/packages/*.dmg
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attach successful builds to existing alpha.6 release
    runs-on: ubuntu-24.04
    if: always()
    needs: [linux, android, macos]
    steps:
      - name: Download successful build packages
        uses: actions/download-artifact@v4
        with:
          pattern: experimental-*
          path: dist
          merge-multiple: true
      - name: Upload additional platforms, not Windows files
        shell: bash
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -euo pipefail
          test "$EDEN_TARGET_TAG" = "ns2-v0.1.0-alpha.6" || {
            echo "Target is an unexpected release tag: $EDEN_TARGET_TAG" >&2
            exit 1
          }
          gh release view "$EDEN_TARGET_TAG" --json tagName >/dev/null
          mapfile -t packages < <(find dist -maxdepth 1 -type f \( -name '*.apk' -o -name '*.tar.gz' -o -name '*.dmg' \) | sort)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No successful other-platform builds; existing Windows release remains unchanged."
            exit 0
          fi
          (cd dist && sha256sum *.apk *.tar.gz *.dmg 2>/dev/null > SHA256SUMS-additional-platforms.txt) || {
            : > dist/SHA256SUMS-additional-platforms.txt
            (cd dist && for f in *.apk *.tar.gz *.dmg; do test -f "$f" && sha256sum "$f"; done) > dist/SHA256SUMS-additional-platforms.txt
          }
          gh release upload "$EDEN_TARGET_TAG" "${packages[@]}" \
            dist/SHA256SUMS-additional-platforms.txt --clobber
          echo "Uploaded the following extra platform assets:" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- %s\n' "${packages[@]}" >> "$GITHUB_STEP_SUMMARY"
